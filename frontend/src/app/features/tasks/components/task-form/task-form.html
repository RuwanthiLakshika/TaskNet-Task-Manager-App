<form class="task-form" [formGroup]="form" (ngSubmit)="submit()">
	<div class="field">
		<label for="title">Task title</label>
		<input id="title" type="text" formControlName="title" placeholder="What needs to get done?" />
		@if (form.controls.title.invalid && form.controls.title.touched) {
			<small>Enter a title with fewer than 255 characters.</small>
		}
	</div>

	<div class="field">
		<label for="description">Description <span>Optional</span></label>
		<textarea id="description" rows="3" formControlName="description" placeholder="Add a little context..."></textarea>
	</div>

	@if (errorMessage) {
		<p class="error" role="alert">{{ errorMessage }}</p>
	}

	<button type="submit" [disabled]="isSubmitting">
		{{ isSubmitting ? 'Adding task...' : 'Add task' }}
	</button>
</form>
